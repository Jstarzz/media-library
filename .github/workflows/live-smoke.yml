name: Live extraction smoke

on:
  workflow_dispatch:
    inputs:
      urls_json:
        description: 'JSON array of public/authorized URLs to exercise'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      MEDIA_LIBRARY_LIVE_URLS_JSON: ${{ inputs.urls_json }}
      MEDIA_LIBRARY_DATA_DIR: /tmp/media-library-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q -m live
