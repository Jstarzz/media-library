[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-library"
version = "0.1.0"
description = "Reusable internal client media/content library"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.36,<3",
  "pydantic-settings>=2.7,<3",
  "jinja2>=3.1.5,<4",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.3,<6",
  "pillow>=11,<12",
  "yt-dlp>=2025.1.15",
  "gallery-dl>=1.28,<2",
  "playwright>=1.51,<2",
  "mcp>=1.6,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: opt-in tests that access real external URLs",
]
