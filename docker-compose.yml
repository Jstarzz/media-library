services:
  media-library:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MEDIA_LIBRARY_DATA_DIR: /data
      MEDIA_LIBRARY_ADMIN_TOKEN: ${MEDIA_LIBRARY_ADMIN_TOKEN:-change-me}
      MEDIA_LIBRARY_PUBLIC_BASE_URL: ${MEDIA_LIBRARY_PUBLIC_BASE_URL:-http://localhost:8000}
      MEDIA_LIBRARY_MAX_MEDIA_MB: ${MEDIA_LIBRARY_MAX_MEDIA_MB:-250}
      MEDIA_LIBRARY_MAX_HTML_MB: ${MEDIA_LIBRARY_MAX_HTML_MB:-8}
      MEDIA_LIBRARY_SCAN_CONCURRENCY: ${MEDIA_LIBRARY_SCAN_CONCURRENCY:-4}
      MEDIA_LIBRARY_COOKIE_DIR: /data/auth
      MEDIA_LIBRARY_BROWSER_ENABLED: ${MEDIA_LIBRARY_BROWSER_ENABLED:-true}
      MEDIA_LIBRARY_BROWSER_TIMEOUT_MS: ${MEDIA_LIBRARY_BROWSER_TIMEOUT_MS:-20000}
      MEDIA_LIBRARY_BROWSER_SCROLLS: ${MEDIA_LIBRARY_BROWSER_SCROLLS:-3}
    volumes:
      - media-library-data:/data

volumes:
  media-library-data:
