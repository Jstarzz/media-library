<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Media Library{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <header class="sticky top-0 z-20 border-b border-zinc-800 bg-zinc-950/95 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center gap-6 px-5 py-3">
      <a href="/" class="font-semibold tracking-tight">Media Library</a>
      <nav class="flex gap-4 text-sm text-zinc-400">
        <a class="hover:text-white" href="/">Clients</a>
        <a class="hover:text-white" href="/import">Import</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-7xl px-5 py-6">{% block content %}{% endblock %}</main>
</body>
</html>
